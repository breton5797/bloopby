const trName=t=>t==='none'?T('none'):(T('themes')[t]?T('themes')[t][1]:T('trn')[t]);
/* ----- season pass ----- */
const SPN=30,SPX=100,PASS_COST=1200;
function seasonNo(){return Math.floor(weekNo()/4);}
function ensureSeason(){const n=seasonNo();if(save.sp.sn!==n){save.sp={sn:n,xp:0,prem:0,cf:[],cp:[]};persist();}}
function seasonLeft(){return (seasonNo()+1)*28-(dayNum()+3)+0;}
function spFree(i){return i%5===0?['s',20]:i%3===0?['b',1]:['p',40+i*5];}
function spPrem(i){return i===30?['c','whale']:i===20?['t','gold']:i===10?['t','aurora']:i%5===0?['p',300]:i%2?['s',10]:['p',100];}
function spLbl(r){return r[0]==='p'?'● '+r[1]:r[0]==='s'?'🐚 '+r[1]:r[0]==='b'?'🛡 x'+r[1]:r[0]==='t'?'✨ '+trName(r[1]):'🐳 '+T('c')[r[1]][0];}
function spGrant(r){if(r[0]==='p')save.pearls+=r[1];else if(r[0]==='s')save.ev.shells+=r[1];else if(r[0]==='b')save.ev.bs+=r[1];else if(r[0]==='t'){if(save.ev.trails.indexOf(r[1])<0)save.ev.trails.push(r[1]);}else if(save.owned.indexOf(r[1])<0)giveChar(r[1]);}
const spTier=()=>Math.min(SPN,Math.floor(save.sp.xp/SPX));
function spClaimable(){const t=spTier();let n=0;for(let i=1;i<=t;i++){if(save.sp.cf.indexOf(i)<0)n++;if(save.sp.prem&&save.sp.cp.indexOf(i)<0)n++;}return n;}
function spClaim(i){if(i>spTier())return 0;let n=0;if(save.sp.cf.indexOf(i)<0){save.sp.cf.push(i);spGrant(spFree(i));n++;}if(save.sp.prem&&save.sp.cp.indexOf(i)<0){save.sp.cp.push(i);spGrant(spPrem(i));n++;}return n;}
function addSP(n){ensureSeason();save.sp.xp+=n;}
/* ----- cloud save (per-viewer private doc) ----- */
let cloudOk=false,cloudBusy=false,cloudDirty=false;
const cloudRef=()=>DB&&UID?DB.doc('data/users/'+UID+'/save'):null;
async function cloudLoad(){
 const r=cloudRef();if(!r)return;
 try{const sn=await withTO(r.get());cloudOk=true;
  if(sn.exists){const d=sn.data()||{};if((d.xp||0)>(save.xp||0)&&d.v){const v=JSON.parse(d.v);for(const k in save)delete save[k];Object.assign(save,v);normalizeSave();try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}
   if(state==='menu'){pend.push(()=>openGp('☁️',box=>box.appendChild(mk('g',T('cloud')))));buildMenu();}return;}}
  cloudSave();
 }catch(e){}
}
function cloudSave(){
 if(NET==='sb')return sbCloudSave();
 if(!cloudOk)return;cloudDirty=true;if(cloudBusy)return;cloudBusy=true;
 (async()=>{while(cloudDirty){cloudDirty=false;try{await withTO(cloudRef().set({v:JSON.stringify(save),xp:save.xp||0,ts:save.ts||Date.now()}));}catch(e){if(e&&e.code==='invalid_argument'){cloudOk=false;break;}}await new Promise(r=>setTimeout(r,8000));}cloudBusy=false;})();
}

 else if(m.mv==='zig'){const u=((t*m.f+m.ph)%2+2)%2;dy+=m.a*(u<1?u:2-u);m.rot=(u<1?1:-1)*m.side*.25;}
 else if(m.mv==='orbit'){const an=t*m.f+m.ph;x+=Math.cos(an)*m.R;dy+=m.hub+Math.sin(an)*m.R;}

function music(){
 if(!AC||!G||!G.started||AC.state!=='running')return;
 const fev=G.feverT>0,z=G.zone,sd=60/(fev?172:(108+z*6))/2;
 if(nextNote<AC.currentTime)nextNote=AC.currentTime+.03;

  tone(f*(fev?4:2),sd*.85,fev?'square':'triangle',fev?.028:.04,null,d,musBus);
  if(mstep%4===0)tone(ROOTS[z]/2*(mstep%16===12?1.335:1),sd*1.9,'sine',.13,null,d,musBus);

  mstep++;nextNote+=sd;

}
